<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            text-align: center;
        }
        input {
            display: block;
            margin: 10px 0;
            padding: 10px;
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Connexion</h2>
        <input type="text" placeholder="Pseudo" id="pseudo">
        <input type="password" placeholder="Mot de passe" id="motdepasse">
        <button onclick="verifier()">Se connecter</button>
        <p id="message"></p>
    </div>

    <script>
        function verifier() {
            var pseudo = document.getElementById("pseudo").value;
            var motdepasse = document.getElementById("motdepasse").value;
            
            if (pseudo === "admin" && motdepasse === "1234") {
                document.getElementById("message").innerText = "Connexion réussie !";
                document.getElementById("message").style.color = "green";
            } else {
                document.getElementById("message").innerText = "Pseudo ou mot de passe incorrect";
                document.getElementById("message").style.color = "red";
            }
        }
    </script>
</body>
</html>
