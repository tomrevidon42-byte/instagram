<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <style>
        body {
            background-color: #fafafa;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            padding: 40px;
            width: 300px;
            text-align: center;
        }
        .login-box h1 {
            font-family: 'Georgia', serif;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #1877f2;
        }
        #message {
            margin-top: 15px;
            color: red;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Instagram</h1>
        <input type="text" id="username" placeholder="admin">
        <input type="password" id="password" placeholder="1704">
        <button onclick="verifierConnexion()">Se connecter</button>
        <p id="message"></p>
    </div>

    <script>
        function verifierConnexion() {
            var user = document.getElementById("username").value;
            var pass = document.getElementById("password").value;

            if (user === "tonpseudo" && pass === "tonmotdepasse") {
                document.getElementById("message").style.color = "green";
                document.getElementById("message").innerText = "Connexion réussie !";
            } else {
                document.getElementById("message").innerText = "Nom d'utilisateur ou mot de passe incorrect.";
            }
        }
    </script>
</body>
</html>
